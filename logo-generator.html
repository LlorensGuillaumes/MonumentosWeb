<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de logo · Patrimonio Europeo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 0 0 0.5rem; }
  p { margin: 0 0 1.5rem; opacity: 0.7; text-align: center; max-width: 600px; }
  .controls {
    background: #1e293b;
    padding: 1.5rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 640px;
  }
  .row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.85rem;
    flex: 1;
    min-width: 140px;
  }
  input, select {
    padding: 0.6rem;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input[type="color"] { padding: 2px; height: 44px; cursor: pointer; }
  .preview {
    background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 20px 20px;
    padding: 1rem;
    border-radius: 12px;
    margin-bottom: 1.5rem;
  }
  #canvas {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 0.7rem 1.2rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: background 0.15s;
  }
  button:hover { background: #2563eb; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
</style>
</head>
<body>

<h1>🏛️ Generador de logo</h1>
<p>Ajusta los parámetros, previsualiza y descarga el logo como PNG o JPG. Puedes generarlo en distintos tamaños y colores. Las transparencias solo funcionan en PNG.</p>

<div class="controls">
  <div class="row">
    <label>
      Tamaño (px)
      <select id="size">
        <option value="256">256 × 256 (favicon grande)</option>
        <option value="512" selected>512 × 512 (PWA)</option>
        <option value="1000">1000 × 1000 (perfil redes)</option>
        <option value="1080">1080 × 1080 (Instagram)</option>
        <option value="2000">2000 × 2000 (alta resolución)</option>
      </select>
    </label>
    <label>
      Estilo de fondo
      <select id="style">
        <option value="gradient" selected>Degradado azul</option>
        <option value="solid">Color sólido</option>
        <option value="rounded">Cuadrado redondeado</option>
        <option value="circle">Círculo</option>
        <option value="transparent">Transparente (solo PNG)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>
      Color primario
      <input type="color" id="color1" value="#0f172a">
    </label>
    <label>
      Color secundario (gradiente)
      <input type="color" id="color2" value="#1e3a8a">
    </label>
    <label>
      Emoji / letra
      <input type="text" id="emoji" value="🏛️" maxlength="4">
    </label>
  </div>
  <div class="row">
    <label>
      Tamaño del emoji (%)
      <input type="range" id="emojiSize" min="40" max="95" value="70">
    </label>
  </div>
</div>

<div class="preview">
  <canvas id="canvas" width="512" height="512"></canvas>
</div>

<div class="buttons">
  <button onclick="download('png')">⬇ Descargar PNG</button>
  <button onclick="download('jpg')">⬇ Descargar JPG</button>
  <button class="secondary" onclick="download('webp')">⬇ Descargar WebP</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function render() {
  const size = parseInt(document.getElementById('size').value);
  const style = document.getElementById('style').value;
  const color1 = document.getElementById('color1').value;
  const color2 = document.getElementById('color2').value;
  const emoji = document.getElementById('emoji').value || '🏛️';
  const emojiPct = parseInt(document.getElementById('emojiSize').value) / 100;

  canvas.width = size;
  canvas.height = size;
  ctx.clearRect(0, 0, size, size);

  // Background
  if (style !== 'transparent') {
    ctx.save();
    if (style === 'circle') {
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.clip();
    } else if (style === 'rounded') {
      const r = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.arcTo(size, 0, size, size, r);
      ctx.arcTo(size, size, 0, size, r);
      ctx.arcTo(0, size, 0, 0, r);
      ctx.arcTo(0, 0, size, 0, r);
      ctx.closePath();
      ctx.clip();
    }

    if (style === 'solid') {
      ctx.fillStyle = color1;
    } else {
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, color1);
      grad.addColorStop(1, color2);
      ctx.fillStyle = grad;
    }
    ctx.fillRect(0, 0, size, size);

    // subtle glow from top
    const glow = ctx.createRadialGradient(size / 2, 0, 0, size / 2, 0, size * 0.8);
    glow.addColorStop(0, 'rgba(96, 165, 250, 0.3)');
    glow.addColorStop(1, 'rgba(96, 165, 250, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    ctx.restore();
  }

  // Emoji centered
  const fontSize = Math.floor(size * emojiPct);
  ctx.font = `${fontSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, size / 2, size / 2 + fontSize * 0.05);
}

function download(format) {
  render();
  const mime = format === 'jpg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
  const quality = format === 'jpg' || format === 'webp' ? 0.95 : undefined;

  // For JPG we need a solid background (JPG does not support transparency)
  if (format === 'jpg') {
    const style = document.getElementById('style').value;
    if (style === 'transparent') {
      alert('JPG no soporta transparencia. Cambia el estilo de fondo a "Color sólido" u otro.');
      return;
    }
  }

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `logo-patrimonio-europeo-${canvas.width}.${format}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, mime, quality);
}

// Listeners
['size', 'style', 'color1', 'color2', 'emoji', 'emojiSize'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

render();
</script>

</body>
</html>
