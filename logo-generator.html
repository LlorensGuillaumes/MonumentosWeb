<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de logo · Patrimonio Europeo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 0 0 0.5rem; }
  p { margin: 0 0 1.5rem; opacity: 0.7; text-align: center; max-width: 600px; }
  .controls {
    background: #1e293b;
    padding: 1.5rem;
    border-radius: 12px;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 640px;
  }
  .row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .row:last-child { margin-bottom: 0; }
  label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.85rem;
    flex: 1;
    min-width: 140px;
  }
  input, select {
    padding: 0.6rem;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input[type="color"] { padding: 2px; height: 44px; cursor: pointer; }
  .preview {
    background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 50% / 20px 20px;
    padding: 1rem;
    border-radius: 12px;
    margin-bottom: 1.5rem;
  }
  #canvas {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 0.7rem 1.2rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: background 0.15s;
  }
  button:hover { background: #2563eb; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
</style>
</head>
<body>

<h1>🏛️ Generador de logo</h1>
<p>Ajusta los parámetros, previsualiza y descarga el logo como PNG o JPG. Puedes generarlo en distintos tamaños y colores. Las transparencias solo funcionan en PNG.</p>

<div class="controls">
  <div class="row">
    <label>
      Tamaño (px)
      <select id="size">
        <option value="256">256 × 256 (favicon grande)</option>
        <option value="512" selected>512 × 512 (PWA)</option>
        <option value="1000">1000 × 1000 (perfil redes)</option>
        <option value="1080">1080 × 1080 (Instagram)</option>
        <option value="2000">2000 × 2000 (alta resolución)</option>
      </select>
    </label>
    <label>
      Estilo de fondo
      <select id="style">
        <option value="gradient" selected>Degradado azul</option>
        <option value="solid">Color sólido</option>
        <option value="rounded">Cuadrado redondeado</option>
        <option value="circle">Círculo</option>
        <option value="transparent">Transparente (solo PNG)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>
      Color primario
      <input type="color" id="color1" value="#0f172a">
    </label>
    <label>
      Color secundario (gradiente)
      <input type="color" id="color2" value="#1e3a8a">
    </label>
    <label>
      Símbolo
      <select id="logoType">
        <option value="emblema" selected>Emblema Patrimonio</option>
        <option value="arc">Arc gòtic</option>
        <option value="pe">Monograma PE</option>
        <option value="emoji">Emoji / letra (personalizado)</option>
      </select>
    </label>
  </div>
  <div class="row" id="emojiRow" style="display:none">
    <label>
      Emoji / letra
      <input type="text" id="emoji" value="🏛️" maxlength="4">
    </label>
  </div>
  <div class="row">
    <label>
      Tamaño del símbolo (%)
      <input type="range" id="emojiSize" min="40" max="95" value="70">
    </label>
  </div>
</div>

<div class="preview">
  <canvas id="canvas" width="512" height="512"></canvas>
</div>

<div class="buttons">
  <button onclick="download('png')">⬇ Descargar PNG</button>
  <button onclick="download('jpg')">⬇ Descargar JPG</button>
  <button class="secondary" onclick="download('webp')">⬇ Descargar WebP</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Patrimonio Europeo logo variants (inlined so the tool works offline / via file://)
const LOGO_SVGS = {
  emblema: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1a365d"/>
        <stop offset="100%" stop-color="#2c5282"/>
      </linearGradient>
    </defs>
    <circle cx="512" cy="512" r="512" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="470" stroke="#F8FAFC" stroke-width="2" fill="none" opacity="0.25"/>
    <path d="M 280 200 A 320 320 0 0 1 744 200" stroke="#D6BC7A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M260 590 L380 590" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round"/>
    <path d="M282 590 L295 680" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round"/>
    <path d="M345 590 L358 680" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round"/>
    <path d="M415 360 L415 600 L605 600 L605 360" stroke="#F8FAFC" stroke-width="12" stroke-linejoin="round" fill="none"/>
    <path d="M415 360 L437 338 L459 360 L481 338 L503 360 L525 338 L547 360 L569 338 L591 360 L605 360" stroke="#F8FAFC" stroke-width="12" stroke-linejoin="round" fill="none"/>
    <rect x="490" y="460" width="40" height="140" stroke="#D6BC7A" stroke-width="9" fill="none" rx="4"/>
    <path d="M645 400 L780 400 L780 680 L645 680 Z" stroke="#F8FAFC" stroke-width="12" stroke-linejoin="round" fill="none"/>
    <path d="M712 260 L645 400 L780 400 Z" stroke="#F8FAFC" stroke-width="12" stroke-linejoin="round" fill="none"/>
    <circle cx="712" cy="490" r="26" stroke="#D6BC7A" stroke-width="9" fill="none"/>
    <path d="M687 680 L687 555 Q712 515 737 555 L737 680" stroke="#D6BC7A" stroke-width="9" fill="none"/>
    <text x="512" y="820" text-anchor="middle" fill="#F8FAFC" font-size="72" font-family="Montserrat, Arial, sans-serif" font-weight="600" letter-spacing="10">PATRIMONIO</text>
    <text x="512" y="890" text-anchor="middle" fill="#D6BC7A" font-size="42" font-family="Montserrat, Arial, sans-serif" font-weight="400" letter-spacing="14">EUROPEO</text>
  </svg>`,
  arc: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1a365d"/>
        <stop offset="100%" stop-color="#2c5282"/>
      </linearGradient>
    </defs>
    <circle cx="512" cy="512" r="512" fill="url(#bg)"/>
    <path d="M 340 800 L 340 480 A 172 260 0 0 1 512 220 A 172 260 0 0 1 684 480 L 684 800 Z" fill="none" stroke="#F8FAFC" stroke-width="48" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="512" cy="520" r="36" fill="#D6BC7A"/>
    <circle cx="512" cy="520" r="18" fill="url(#bg)"/>
  </svg>`,
  pe: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1a365d"/>
        <stop offset="100%" stop-color="#2c5282"/>
      </linearGradient>
    </defs>
    <circle cx="512" cy="512" r="512" fill="url(#bg)"/>
    <text x="512" y="680" text-anchor="middle" fill="#F8FAFC" font-size="560" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" letter-spacing="-30">PE</text>
    <rect x="362" y="780" width="300" height="14" fill="#D6BC7A" rx="7"/>
  </svg>`,
};

// Pre-load each logo as an Image so render() can draw synchronously after first load
const LOGO_IMAGES = {};
for (const [key, svgText] of Object.entries(LOGO_SVGS)) {
  const img = new Image();
  img.onload = () => render();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
  LOGO_IMAGES[key] = img;
}

function render() {
  const size = parseInt(document.getElementById('size').value);
  const style = document.getElementById('style').value;
  const color1 = document.getElementById('color1').value;
  const color2 = document.getElementById('color2').value;
  const logoType = document.getElementById('logoType').value;
  const emoji = document.getElementById('emoji').value || '🏛️';
  const symbolPct = parseInt(document.getElementById('emojiSize').value) / 100;

  canvas.width = size;
  canvas.height = size;
  ctx.clearRect(0, 0, size, size);

  // Background
  if (style !== 'transparent') {
    ctx.save();
    if (style === 'circle') {
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.clip();
    } else if (style === 'rounded') {
      const r = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.arcTo(size, 0, size, size, r);
      ctx.arcTo(size, size, 0, size, r);
      ctx.arcTo(0, size, 0, 0, r);
      ctx.arcTo(0, 0, size, 0, r);
      ctx.closePath();
      ctx.clip();
    }

    if (style === 'solid') {
      ctx.fillStyle = color1;
    } else {
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, color1);
      grad.addColorStop(1, color2);
      ctx.fillStyle = grad;
    }
    ctx.fillRect(0, 0, size, size);

    // subtle glow from top
    const glow = ctx.createRadialGradient(size / 2, 0, 0, size / 2, 0, size * 0.8);
    glow.addColorStop(0, 'rgba(96, 165, 250, 0.3)');
    glow.addColorStop(1, 'rgba(96, 165, 250, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    ctx.restore();
  }

  // Symbol centered (SVG logo or emoji fallback)
  const symbolSize = Math.floor(size * symbolPct);
  if (logoType === 'emoji') {
    ctx.font = `${symbolSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, size / 2, size / 2 + symbolSize * 0.05);
  } else {
    const img = LOGO_IMAGES[logoType];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, (size - symbolSize) / 2, (size - symbolSize) / 2, symbolSize, symbolSize);
    }
  }
}

function download(format) {
  render();
  const mime = format === 'jpg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
  const quality = format === 'jpg' || format === 'webp' ? 0.95 : undefined;

  // For JPG we need a solid background (JPG does not support transparency)
  if (format === 'jpg') {
    const style = document.getElementById('style').value;
    if (style === 'transparent') {
      alert('JPG no soporta transparencia. Cambia el estilo de fondo a "Color sólido" u otro.');
      return;
    }
  }

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `logo-patrimonio-europeo-${canvas.width}.${format}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, mime, quality);
}

// Listeners
['size', 'style', 'color1', 'color2', 'emoji', 'emojiSize', 'logoType'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

// Toggle visibility of the emoji input row based on the selected symbol type
document.getElementById('logoType').addEventListener('change', () => {
  const isEmoji = document.getElementById('logoType').value === 'emoji';
  document.getElementById('emojiRow').style.display = isEmoji ? 'flex' : 'none';
});

render();
</script>

</body>
</html>
