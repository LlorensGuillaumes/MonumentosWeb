  <!-- Vertical flutes -->
  <line x1="450" y1="300" x2="450" y2="728" stroke="#1a365d" stroke-width="6" opacity="0.35"/>
  <line x1="512" y1="300" x2="512" y2="728" stroke="#1a365d" stroke-width="6" opacity="0.35"/>
  <line x1="574" y1="300" x2="574" y2="728" stroke="#1a365d" stroke-width="6" opacity="0.35"/>

  <!-- Base (bottom, wider) -->
