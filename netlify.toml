[build]
  command = "vite build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://monumentosback.onrender.com/api"
  VITE_API_URL_FALLBACK = "https://patrimonio-api-pmvp.onrender.com/api"
  SITE_URL = "https://patrimonio-europeo.netlify.app"

# Redirect dominio antiguo al nuevo (preserva path)
[[redirects]]
  from = "https://shiny-licorice-a01ea4.netlify.app/*"
  to = "https://patrimonio-europeo.netlify.app/:splat"
  status = 301
  force = true

# SPA: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers para todas las rutas
[[headers]]
  for = "/*"
  [headers.values]
    # Evita clickjacking (no permitir embeber en iframes)
    X-Frame-Options = "DENY"
    # Evita MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Política de referrer estricta: no envía referrer al cambiar de origen
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS: forzar HTTPS durante 1 año (incluye subdominios, allow preload)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Permissions-Policy: deshabilita features que no usamos
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"
    # Cross-Origin-Opener-Policy para aislamiento de pestañas
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
